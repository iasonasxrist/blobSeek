services:
  postgres:
    ports:
      - "5432:5432"

  api:
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Billing__RequireActiveSubscription: "true"

  worker:
    environment:
      DOTNET_ENVIRONMENT: Development

  frontend:
    ports:
      - "5173:80"
